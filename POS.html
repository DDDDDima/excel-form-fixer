<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <meta charset="UTF-8">
    <title>Stellar CRM POS</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            /* Green-500 */
            --primary-dark: #059669;
            /* Green-600 */
            --bg: #0f172a;
            /* Slate-900 */
            --card-bg: #1e293b;
            /* Slate-800 */
            --text: #f8fafc;
            /* Slate-50 */
            --text-muted: #94a3b8;
            /* Slate-400 */
            --danger: #ef4444;
            /* Red-500 */
            --accent: #6366f1;
            /* Indigo-500 */
            --header-h: 80px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Authentication Overlay */
        #auth-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.3s ease;
        }

        .auth-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .auth-card h1 {
            margin-bottom: 24px;
            font-weight: 600;
            background: linear-gradient(135deg, #10b981 0%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-card input {
            width: 100%;
            padding: 16px;
            margin-bottom: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .auth-card input:focus {
            border-color: var(--primary);
        }

        .auth-card button {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 600;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        .auth-card button:active {
            transform: scale(0.98);
            background: var(--primary-dark);
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-h);
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .multiplier-input {
            width: 70px;
            height: 48px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: white;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            outline: none;
        }

        .multiplier-label {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        #send-btn {
            background: var(--primary);
            color: white;
            padding: 12px 32px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 18px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3);
        }

        #send-btn:active {
            transform: scale(0.95);
        }

        #send-btn:disabled {
            background: #475569;
            box-shadow: none;
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Product Grid */
        main {
            padding: calc(var(--header-h) + 20px) 20px 20px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            max-width: 1200px;
            margin: 0 auto;
        }

        @media (min-width: 768px) {
            .product-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
            }
        }

        @media (min-width: 1024px) {
            .product-grid {
                grid-template-columns: repeat(6, 1fr);
            }
        }

        .product-btn {
            position: relative;
            aspect-ratio: 1 / 1;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .product-btn:active {
            transform: translateY(2px) scale(0.96);
            background: #334155;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .product-name {
            font-size: 14px;
            font-weight: 600;
            word-wrap: break-word;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-price {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--danger);
            color: white;
            min-width: 24px;
            height: 24px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            padding: 0 6px;
            box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.4);
            transform: scale(0);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .badge.show {
            transform: scale(1);
        }

        /* Loading */
        #loader {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--accent);
            padding: 10px 20px;
            border-radius: 30px;
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 1000;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .toast {
            position: fixed;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            background: #334155;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            transition: bottom 0.3s;
            z-index: 2000;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .toast.show {
            bottom: 30px;
        }
    </style>
</head>

<body>

    <div id="auth-overlay">
        <div class="auth-card">
            <h1>STELLAR POS</h1>
            <input type="text" id="login" placeholder="Логін" autocomplete="username">
            <input type="password" id="password" placeholder="Пароль" autocomplete="current-password">
            <button onclick="login()">УВІЙТИ</button>
        </div>
    </div>

    <header id="main-header" style="display: none;">
        <div class="header-left">
            <div style="display: flex; flex-direction: column;">
                <span class="multiplier-label">Множник</span>
                <input type="number" id="multiplier" class="multiplier-input" value="1" min="1">
            </div>
        </div>
        <button id="send-btn" onclick="sendSales()" disabled>ВІДПРАВИТИ (0)</button>
    </header>

    <main id="main-content" style="display: none;">
        <div id="product-grid" class="product-grid">
            <!-- Buttons will be injected here -->
        </div>
    </main>

    <div id="loader">
        <div class="spinner"></div>
        <span>Надсилаю...</span>
    </div>

    <div id="toast" class="toast">Повідомлення</div>

    <script>
        let products = [];
        let salesMap = {};
        let currentUser = null;

        function showToast(msg, duration = 3000) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), duration);
        }

        function login() {
            const loginVal = document.getElementById('login').value;
            const passVal = document.getElementById('password').value;

            if (!loginVal || !passVal) {
                showToast('Введіть логін та пароль');
                return;
            }

            // Ми передамо це бекенду при кожній дії
            currentUser = { login: loginVal, password: passVal };

            // Спробуємо отримати дані, щоб перевірити логін
            loadProducts();
        }

        function loadProducts() {
            console.log('Починаю завантаження товарів...');
            document.getElementById('auth-overlay').style.opacity = '0.5';

            google.script.run
                .withSuccessHandler(data => {
                    console.log('Отримано дані від сервера:', data);
                    document.getElementById('auth-overlay').style.opacity = '1';

                    if (data === null || data === undefined) {
                        const errorMsg = 'Помилка: Бекенд повернув null або undefined. \n\n' +
                            'Ймовірні причини: \n' +
                            '1. Ви не зберегли проект у GAS (іконка дискети).\n' +
                            '2. Ви не зробили New Deployment після оновлення Code.gs.\n' +
                            '3. Функція fetchInventoryData видає помилку.';
                        alert(errorMsg);
                        return;
                    }

                    if (data.error) {
                        alert('Помилка в самому скрипті (Apps Script): ' + data.error);
                        return;
                    }

                    if (!data.salesProducts) {
                        alert('Помилка: Поле salesProducts відсутнє у відповіді сервера. Перевірте функцію fetchInventoryData.');
                        return;
                    }

                    products = data.salesProducts || [];
                    console.log('Список товарів:', products);

                    if (products.length === 0) {
                        alert('Попередження: Список товарів порожній. Перевірте, чи заповнені колонки L та M на аркуші "Прихід_форми".');
                    }

                    renderGrid();
                    document.getElementById('auth-overlay').style.display = 'none';
                    document.getElementById('main-header').style.display = 'flex';
                    document.getElementById('main-content').style.display = 'block';
                })
                .withFailureHandler(err => {
                    console.error('Критична помилка google.script.run:', err);
                    document.getElementById('auth-overlay').style.opacity = '1';
                    alert('Критична помилка зв\'язку з сервером: ' + err.toString());
                })
                .fetchInventoryData();
        }

        function renderGrid() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            products.forEach((p, idx) => {
                const btn = document.createElement('div');
                btn.className = 'product-btn';
                btn.onclick = () => addToSale(idx);

                btn.innerHTML = `
                    <div id="badge-${idx}" class="badge">0</div>
                    <div class="product-name">${p.name}</div>
                    <div class="product-price">${p.price} ₴</div>
                `;
                grid.appendChild(btn);
            });
        }

        function addToSale(idx) {
            const mult = parseInt(document.getElementById('multiplier').value) || 1;
            const productName = products[idx].name;

            if (!salesMap[productName]) {
                salesMap[productName] = {
                    item: productName,
                    quantity: 0,
                    price: products[idx].price
                };
            }

            salesMap[productName].quantity += mult;

            updateUI(idx);

            // Feedback animation
            const btn = document.querySelectorAll('.product-btn')[idx];
            btn.style.borderColor = 'var(--primary)';
            setTimeout(() => btn.style.borderColor = 'rgba(255,255,255,0.05)', 200);
        }

        function updateUI(idx) {
            const productName = products[idx].name;
            const badge = document.getElementById(`badge-${idx}`);
            const count = salesMap[productName] ? salesMap[productName].quantity : 0;

            if (count > 0) {
                badge.textContent = count;
                badge.classList.add('show');
            } else {
                badge.classList.remove('show');
            }

            const totalItems = Object.values(salesMap).reduce((acc, curr) => acc + curr.quantity, 0);
            const sendBtn = document.getElementById('send-btn');
            sendBtn.disabled = totalItems === 0;
            sendBtn.textContent = `ВІДПРАВИТИ (${totalItems})`;
        }

        function sendSales() {
            const salesArray = Object.values(salesMap).filter(s => s.quantity > 0);
            if (salesArray.length === 0) return;

            document.getElementById('send-btn').disabled = true;
            document.getElementById('loader').style.display = 'flex';

            google.script.run
                .withSuccessHandler(res => {
                    document.getElementById('loader').style.display = 'none';
                    if (res.success) {
                        showToast('Успішно відправлено!');
                        resetCounters();
                    } else {
                        showToast('Помилка: ' + res.message);
                        document.getElementById('send-btn').disabled = false;
                    }
                })
                .withFailureHandler(err => {
                    document.getElementById('loader').style.display = 'none';
                    showToast('Помилка мережі: ' + err);
                    document.getElementById('send-btn').disabled = false;
                })
                .processBulkSales(salesArray, currentUser);
        }

        function resetCounters() {
            salesMap = {};
            document.getElementById('send-btn').textContent = 'ВІДПРАВИТИ (0)';
            document.getElementById('send-btn').disabled = true;
            document.getElementById('multiplier').value = 1;

            const badges = document.querySelectorAll('.badge');
            badges.forEach(b => b.classList.remove('show'));
        }
    </script>
</body>

</html>
